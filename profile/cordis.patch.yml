# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers: {}
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: visionforge
  disabled: true
- id: pet
  name: "@linxin666/dsh-pet"
  config:
    visible: true
    size: 160
    right: 48
    bottom: 456
    petId: whale-girl
- id: dsh-ops-shell
  name: dsh-ops/shell
  config:
    promptPolicy: true
    publishBashTool: true
    shellPolicy: advise
    allowSystemShellFallback: false
    configUpdateVersion: 2
- id: dsh-ops-file
  name: dsh-ops/file
  config:
    promptPolicy: true
    required: false
    configUpdateVersion: 2
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: ddg
    fetchProvider: fs-quality-fetch
- id: dsh-chatsync
  disabled: true
- id: image-gen
  name: dsh-image-gen
  config:
    provider: openai-compat
    openaiCompatBaseURL: https://zoecool.top/v1
    openaiCompatModel: gpt-image-2
